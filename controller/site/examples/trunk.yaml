# Example site file, trunk mode (DESIGN.md §5.1): one managed switch port
# carries VLAN 10 (IT) and VLAN 20 (BMS). Hub users, no DHCP on the BMS side,
# upstream NTP from IT, one SFTP backup target plus the UCBACKUP stick.
# The age recipients and SSH keys are test values: nobody holds their
# private keys.
version: 1
site:
  id: hq
  name: Headquarters
  domain: hq.internal
  timezone: Europe/Berlin
controller:
  hostname: ucc-hq
  hardware: pi4
  rtc: ds3231
  ups_gpio: null
  ssd_reserve_percent: 0
network:
  mode: trunk
  parent: eth0
  mac: auto
  it:  {vlan: 10, address: 192.0.2.20/24, gateway: 192.0.2.1, dns: [192.0.2.53]}
  bms: {vlan: 20, address: 10.20.0.2/24, nic_mac: null}
  sources:
    admin: [192.0.2.0/27]
    ui: [192.0.2.0/24]
    backup: [192.0.2.40/32]
    bbmd: []
time:
  servers: [ntp1.corp.example]
  nts: []
  serve: true
services:
  dhcp: {enabled: false, range: [10.20.0.100, 10.20.0.199], lease: 12h}
  syslog: {enabled: true}
  mqtt:
    topic_root: bacnet-uc
    extra_roots: []
    broker_name: null
    expected_devices: null
    third_party_listener: false
  history:
    expected_points: 2000
    raw_days: 400
    log_days: 180
    event_days: 3650
    budget_percent: 60
  hub:
    enabled: true
    users: [{user: ilija, roles: [admin]}]
    llm: {provider: none}
    manifest: null
    overrides: {}
  ui:
    names: [uc-ctl.corp.example]
    cert: site
  updates: {online: true, auto_security: true}
backup:
  recipients:
    - age1tc9wwg2vtgtd29psvsgy8rwlzmuqt5nrvfpg0rqg8y03yq2ct8zsm492fu   # integrator (test key)
    - age1p740ds6s7sg67h3mdvvpmxh8s37gyket4peagdn65xnlmshfggmqg5prmn   # owner (test key)
  targets:
    - {type: sftp, url: "sftp://uc-backup@192.0.2.40:22/uc/hq"}
    - {type: usb, label: UCBACKUP}
  history_repo: null
  at: "02:15"
admins:
  - {name: ilija, keys: ["ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIO8vVyEuSWBxBzEYJ4ijziH7DKc5xluOjG3NXDuEEOCC ilija@laptop"]}
ssh_user_ca: []
