# uc-controller (DESIGN.md §5.2, §4.8): dnsmasq runs only with the rendered
# BMS configuration (the dhcp role writes it when services.dhcp.enabled).
[Unit]
ConditionPathExists=/etc/dnsmasq.d/uc-bms.conf
StartLimitIntervalSec=0

[Service]
Restart=always
RestartSec=5
MemoryMax=64M
OOMScoreAdjust=-900
