# uc-controller (DESIGN.md §7, §4.8): the RTC policy before every start,
# supervision, memory limit and OOM protection.
[Unit]
StartLimitIntervalSec=0

[Service]
# "!": run as root although the unit sets User=_chrony (it writes
# /run/uc-controller); "-": a failing policy must never keep chrony down.
ExecStartPre=-!/usr/lib/uc-controller/uc-time-policy
Restart=always
RestartSec=5
MemoryMax=64M
OOMScoreAdjust=-900
