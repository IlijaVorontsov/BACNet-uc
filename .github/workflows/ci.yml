# SPDX-License-Identifier: Apache-2.0
#
# BACnet-uc CI: harness unit tests, WebAssembly SDK checks, firmware builds
# (native_sim + unit tests, build-only for the two boards) and harness
# end-to-end tests against the native_sim firmware.
#
# The repository is the west manifest repository (west.yml, self path
# BACNet-uc): the firmware job checks it out at <workspace>/BACNet-uc, the
# layout "west init -l BACNet-uc" expects, and builds from the workspace top.
# The other jobs only need the repository itself.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # zephyr v4.4.2 (west.yml) requires Zephyr SDK 1.0.1 (zephyr/SDK_VERSION)
  ZEPHYR_SDK_VERSION: 1.0.1
  # WAMR revision pinned in west.yml
  WAMR_TAG: WAMR-2.4.5

jobs:
  harness:
    name: Harness unit tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: harness/pyproject.toml

      # clang (wasm32 target) and wasm-ld: the tests that build apps run
      # instead of being skipped (wamrc is not installed: AOT tests skip)
      - name: Install clang and lld
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld

      - name: Install the harness
        run: python -m pip install -e 'harness[dev,serial,sim]'

      - name: ruff
        working-directory: harness
        run: ruff check src tests

      # the e2e tests are skipped here (BACNET_UC_FIRMWARE unset), see job e2e
      - name: pytest
        working-directory: harness
        run: python -m pytest -q -rs

  wasm-sdk:
    name: WebAssembly SDK
    runs-on: ubuntu-24.04
    env:
      # WAMR sources for the runner (wasm/sdk/wamr-runner/build.sh); in a
      # west workspace they are modules/lib/wamr
      WAMR_ROOT: ${{ github.workspace }}/wamr
    steps:
      - uses: actions/checkout@v4
        with:
          path: BACNet-uc

      - name: Check out WAMR at the pinned tag
        uses: actions/checkout@v4
        with:
          repository: bytecodealliance/wasm-micro-runtime
          ref: ${{ env.WAMR_TAG }}
          path: wamr

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install clang, lld and the host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld cmake ninja-build
          # the host tests use ASan: keep its shadow mapping working with the
          # runner kernel's mmap randomisation
          sudo sysctl -w vm.mmap_rnd_bits=28

      # wamrc from the WAMR release (building it needs LLVM from source); when
      # the download fails, make check runs without the AOT part
      - name: Fetch wamrc
        id: wamrc
        continue-on-error: true
        run: |
          version=${WAMR_TAG#WAMR-}
          dir="$RUNNER_TEMP/wamrc"
          mkdir -p "$dir"
          curl -fsSL "https://github.com/bytecodealliance/wasm-micro-runtime/releases/download/${WAMR_TAG}/wamrc-${version}-x86_64-ubuntu-22.04.tar.gz" \
            | tar -xz -C "$dir"
          wamrc=$(find "$dir" -type f -name wamrc | head -n 1)
          "$wamrc" --version
          echo "WAMRC=$wamrc" >> "$GITHUB_ENV"

      - name: make check (examples, host tests, AOT, WAMR validation)
        if: steps.wamrc.outcome == 'success'
        run: make -C BACNet-uc/wasm check WAMRC="$WAMRC" PYTHON=python

      - name: make all test validate (no wamrc)
        if: steps.wamrc.outcome != 'success'
        run: make -C BACNet-uc/wasm all test validate PYTHON=python

  firmware:
    name: Firmware (native_sim + unit tests, nucleo_f767zi, frdm_mcxn947)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: BACNet-uc

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build gperf ccache \
            device-tree-compiler

      # west init -l BACNet-uc, west update, Python requirements, Zephyr SDK
      # (native_sim uses the host gcc, the boards arm-zephyr-eabi)
      - name: West workspace and Zephyr SDK
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: BACNet-uc
          sdk-version: ${{ env.ZEPHYR_SDK_VERSION }}
          toolchains: arm-zephyr-eabi

      - name: Build native_sim/native/64
        run: >-
          west build -p -b native_sim/native/64 BACNet-uc/firmware -d build/native
          -- -DCONFIG_COMPILER_WARNINGS_AS_ERRORS=y

      - name: Unit tests (native_sim/native/64)
        run: |
          set -o pipefail
          west build -p -b native_sim/native/64 BACNet-uc/firmware/tests/unit -d build/unit \
            -t run 2>&1 | tee unit-tests.log
          grep -q "PROJECT EXECUTION SUCCESSFUL" unit-tests.log

      - name: Build nucleo_f767zi
        run: >-
          west build -p -b nucleo_f767zi BACNet-uc/firmware -d build/nucleo_f767zi
          -- -DCONFIG_COMPILER_WARNINGS_AS_ERRORS=y

      - name: Build frdm_mcxn947/mcxn947/cpu0
        run: >-
          west build -p -b frdm_mcxn947/mcxn947/cpu0 BACNet-uc/firmware -d build/frdm_mcxn947
          -- -DCONFIG_COMPILER_WARNINGS_AS_ERRORS=y

      - uses: actions/upload-artifact@v4
        with:
          name: native-sim-firmware
          path: build/native/zephyr/zephyr.exe
          if-no-files-found: error
          retention-days: 3

  e2e:
    name: Harness end-to-end (native_sim)
    needs: firmware
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: native-sim-firmware
          path: ${{ runner.temp }}/firmware

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: harness/pyproject.toml

      - name: Install clang and lld
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld

      - name: Install the harness
        run: python -m pip install -e 'harness[dev,serial,sim]'

      # One node in host mode and the two-node sim-demo in network namespaces,
      # all inside private network + mount namespaces (root via sudo).
      - name: End-to-end tests
        working-directory: harness
        env:
          BACNET_UC_FIRMWARE: ${{ runner.temp }}/firmware/zephyr.exe
        run: |
          chmod +x "$BACNET_UC_FIRMWARE"
          sudo --preserve-env=BACNET_UC_FIRMWARE env "PATH=$PATH" PYTHON="$(command -v python)" \
            tests/e2e/run-isolated.sh -m e2e tests/e2e -v -rs --junitxml=e2e.xml
          # every e2e test must have run: a skip here means a missing prerequisite
          python - <<'EOF'
          import xml.etree.ElementTree as ET
          suite = ET.parse("e2e.xml").getroot().find("testsuite")
          tests, skipped = int(suite.get("tests")), int(suite.get("skipped"))
          print(f"e2e: {tests} tests, {skipped} skipped")
          raise SystemExit(1 if skipped or not tests else 0)
          EOF
