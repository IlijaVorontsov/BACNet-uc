# Mosquitto 2.x configuration for a uc-hub site broker.
# Install as /etc/mosquitto/conf.d/uc-hub.conf; see deploy/README.md.
#
# Mutual TLS only: every client (the hub and each board) presents a
# certificate from the site CA (deploy/mqtt-pki.sh), and its CN becomes its
# user name for the ACL.

per_listener_settings true

listener 8883
protocol mqtt
cafile /etc/mosquitto/certs/ca.crt
certfile /etc/mosquitto/certs/broker.crt
keyfile /etc/mosquitto/certs/broker.key
tls_version tlsv1.2
require_certificate true
use_identity_as_username true
allow_anonymous false
acl_file /etc/mosquitto/uc-hub.acl
