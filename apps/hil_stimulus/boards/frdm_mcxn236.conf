# apps/hil_stimulus on FRDM-MCXN236 (merged after prj.conf).
# Machine interface: LP_FLEXCOMM4 LPUART4 (P1_8/P1_9) through the MCU-Link VCOM, 115200 8N1.
# Cycle counter: 64-bit SysTick at 150 MHz (SoC default: MCUX_OS_TIMER=n).

# No VREFINT sensor on MCX: VDDA is taken as 3300 mV (the LPADC reference is VDDA).
CONFIG_SENSOR=n
