# SPDX-License-Identifier: Apache-2.0
# apps/hil_stimulus: HIL stimulus firmware, Zephyr v4.4.2, nucleo_f767zi.
# Machine interface = Zephyr shell on the ST-LINK VCP (USART3, 115200 8N1).

# --- shell as a line protocol ---------------------------------------------
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_PROMPT_UART="stim:~$ "
CONFIG_SHELL_VT100_COLORS=n
# one "stim rs485 load <slot> <off> <400 hex chars>" line is ~430 bytes
CONFIG_SHELL_CMD_BUFF_SIZE=512
CONFIG_SHELL_ARGC_MAX=24
# a whole max-length line fits the RX ring even if the shell thread is busy
CONFIG_SHELL_BACKEND_SERIAL_RX_RING_BUFFER_SIZE=1024
CONFIG_SHELL_BACKEND_SERIAL_TX_RING_BUFFER_SIZE=256
CONFIG_SHELL_PRINTF_BUFF_SIZE=128
CONFIG_SHELL_STACK_SIZE=4096
# '*' and '?' are never command wildcards here
CONFIG_SHELL_WILDCARD=n
CONFIG_SHELL_HISTORY=n
# keep echo on: metakeys (Ctrl-C clears a partial line, used by the host resync) need it
CONFIG_KERNEL_SHELL=y
CONFIG_DEVICE_SHELL=y
CONFIG_REBOOT=y

# --- logging: warnings only, through the shell log backend -----------------
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=2

# --- C library: picolibc (the errno BUILD_ASSERT in stim_cmds.c pins its numbering) ---
CONFIG_PICOLIBC=y

# --- drivers ---------------------------------------------------------------
CONFIG_GPIO=y
CONFIG_ADC=y
CONFIG_DAC=y
CONFIG_PWM=y
CONFIG_PWM_CAPTURE=y
CONFIG_I2C=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_USE_RUNTIME_CONFIGURE=y
CONFIG_HWINFO=y
CONFIG_WATCHDOG=y
CONFIG_CRC=y
# gpio-keys (B1/PC13) must not claim EXTI13
CONFIG_INPUT=n

# built-in driver shells for humans only (tests use "stim ...")
CONFIG_GPIO_SHELL=y
CONFIG_DAC_SHELL=y
CONFIG_PWM_SHELL=y
CONFIG_I2C_SHELL=y

# VDDA from VREFINT (st,stm32-vref) to scale DAC codes and ADC readings
CONFIG_SENSOR=y
