# SPDX-License-Identifier: Apache-2.0
#
# MQTT 3.1.1 client over TLS 1.2 on wired Ethernet (Zephyr 3.7 LTS).

# --- Logging -----------------------------------------------------------------
CONFIG_LOG=y
CONFIG_NET_LOG=y
CONFIG_LOG_BACKEND_SHOW_COLOR=n

# --- IP stack ----------------------------------------------------------------
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_SOCKETS=y
CONFIG_DNS_RESOLVER=y
CONFIG_DNS_RESOLVER_MAX_SERVERS=2
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_CONNECTION_MANAGER=y

# One TLS socket = two descriptors (TLS + underlying TCP), plus DNS sockets.
CONFIG_ZVFS_OPEN_MAX=8

# --- MQTT --------------------------------------------------------------------
CONFIG_MQTT_LIB=y
CONFIG_MQTT_LIB_TLS=y
CONFIG_MQTT_KEEPALIVE=60
CONFIG_MQTT_CLEAN_SESSION=y

# --- TLS (mbedTLS) -----------------------------------------------------------
CONFIG_NET_SOCKETS_SOCKOPT_TLS=y
CONFIG_NET_SOCKETS_TLS_MAX_CONTEXTS=1
CONFIG_TLS_CREDENTIALS=y
CONFIG_TLS_MAX_CREDENTIALS_NUMBER=4

CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_BUILTIN=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
# Full 16 KB records: brokers are not required to honour the max_fragment_length
# extension (AWS IoT and many cloud brokers ignore it), and a server
# certificate chain easily exceeds a smaller record. mbedTLS allocates the input
# and output buffers (~2 x 16.7 KB) from its heap during a session.
CONFIG_MBEDTLS_SSL_MAX_CONTENT_LEN=16384
CONFIG_MBEDTLS_HEAP_SIZE=65536
CONFIG_MBEDTLS_PEM_CERTIFICATE_FORMAT=y
CONFIG_MBEDTLS_TLS_VERSION_1_2=y
CONFIG_MBEDTLS_SSL_EXTENDED_MASTER_SECRET=y
# Forward-secret key exchanges only; the static RSA key exchange is disabled.
CONFIG_MBEDTLS_KEY_EXCHANGE_RSA_ENABLED=n
CONFIG_MBEDTLS_ECP_C=y
CONFIG_MBEDTLS_ECDH_C=y
CONFIG_MBEDTLS_ECDSA_C=y
CONFIG_MBEDTLS_KEY_EXCHANGE_ECDHE_ECDSA_ENABLED=y
CONFIG_MBEDTLS_KEY_EXCHANGE_ECDHE_RSA_ENABLED=y
CONFIG_MBEDTLS_ECP_DP_SECP256R1_ENABLED=y
CONFIG_MBEDTLS_ECP_DP_SECP384R1_ENABLED=y
CONFIG_MBEDTLS_ECP_DP_CURVE25519_ENABLED=y
CONFIG_MBEDTLS_ECP_NIST_OPTIM=y
CONFIG_MBEDTLS_CIPHER_AES_ENABLED=y
CONFIG_MBEDTLS_CIPHER_GCM_ENABLED=y
CONFIG_MBEDTLS_SHA256=y
CONFIG_MBEDTLS_SHA384=y

# Hardware TRNG feeds mbedTLS' CTR_DRBG and sys_csrand_get().
CONFIG_ENTROPY_GENERATOR=y

# --- Application -------------------------------------------------------------
# mbedTLS runs the handshake (ECDHE + certificate verification) on the thread
# that calls connect(), which is main.
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_EVENTS=y
CONFIG_HWINFO=y
CONFIG_GPIO=y
