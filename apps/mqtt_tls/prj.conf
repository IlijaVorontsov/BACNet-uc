# SPDX-License-Identifier: Apache-2.0
#
# MQTT 3.1.1 client over TLS 1.3/1.2 on wired Ethernet (Zephyr 4.4).
# prj_plain.conf is the same without TLS (build with -DFILE_SUFFIX=plain);
# keep the common sections of both files in sync.

# --- Logging -----------------------------------------------------------------
CONFIG_LOG=y
CONFIG_NET_LOG=y
CONFIG_LOG_BACKEND_SHOW_COLOR=n

# --- IP stack ----------------------------------------------------------------
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_SOCKETS=y
# DHCPv4 installs only the first DNS server it is offered, so a single
# resolver slot is all that is ever used.
CONFIG_DNS_RESOLVER=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_CONNECTION_MANAGER=y
# Use only the net_/NET_/ZSOCK_ names; the POSIX-style compatibility names
# are slated for removal.
CONFIG_NET_NAMESPACE_COMPAT_MODE=n


# Bound the TCP connect, and separately the whole TLS handshake (including
# the software ECDHE and certificate verification, which take a while on a
# Cortex-M33 without crypto acceleration).
CONFIG_NET_SOCKETS_CONNECT_TIMEOUT=15000

# RX buffers: the TCP receive window is derived from the pool
# (NET_BUF_RX_COUNT * NET_BUF_DATA_SIZE / 3); the default 1.5 KB window lets
# the broker send only one segment per round trip, and the driver needs 12
# buffers per full-size frame. 96 buffers give a 4 KB window and room for 8
# frames.
CONFIG_NET_BUF_RX_COUNT=96
CONFIG_NET_PKT_RX_COUNT=24

# Ethernet TX runs inline on whichever thread produces the packet (RX thread
# for TCP ACKs, TCP work queue for retransmits, system work queue for DHCP),
# so their default stacks have only a few percent of headroom.
CONFIG_NET_RX_STACK_SIZE=2048
CONFIG_NET_TCP_WORKQ_STACK_SIZE=1536
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=1536
CONFIG_NET_MGMT_EVENT_STACK_SIZE=1024

# --- MQTT --------------------------------------------------------------------
CONFIG_MQTT_LIB=y
CONFIG_MQTT_LIB_TLS=y
CONFIG_MQTT_KEEPALIVE=60

# --- TLS (mbedTLS) -----------------------------------------------------------
CONFIG_NET_SOCKETS_SOCKOPT_TLS=y
CONFIG_NET_SOCKETS_TLS_MAX_CONTEXTS=1
CONFIG_NET_SOCKETS_TLS_CONNECT_TIMEOUT=15000
CONFIG_TLS_CREDENTIALS=y
CONFIG_TLS_MAX_CREDENTIALS_NUMBER=4

CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
# Full 16 KB records: brokers are not required to honour the max_fragment_length
# extension (AWS IoT and many cloud brokers ignore it), and a server
# certificate chain easily exceeds a smaller record. mbedTLS allocates the input
# and output buffers (~2 x 16.7 KB) from its heap during a session.
CONFIG_MBEDTLS_SSL_MAX_CONTENT_LEN=16384
CONFIG_MBEDTLS_HEAP_SIZE=65536
CONFIG_MBEDTLS_PEM_PARSE_C=y
CONFIG_MBEDTLS_SSL_EXTENDED_MASTER_SECRET=y
# Send the broker host name as SNI; multi-tenant brokers (HiveMQ Cloud, EMQX
# Serverless, AWS IoT custom domains) select the tenant from it.
CONFIG_MBEDTLS_SSL_SERVER_NAME_INDICATION=y
CONFIG_MBEDTLS_ECP_NIST_OPTIM=y

# Mbed TLS 4 (Zephyr 4.4) is configured per ciphersuite; each one selects the
# PSA algorithms it needs. Forward-secret ECDHE with AES-GCM only.
# TLS 1.2:
CONFIG_MBEDTLS_CIPHERSUITE_TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256=y
CONFIG_MBEDTLS_CIPHERSUITE_TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384=y
CONFIG_MBEDTLS_CIPHERSUITE_TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256=y
CONFIG_MBEDTLS_CIPHERSUITE_TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384=y
# TLS 1.3 (preferred when the broker offers it):
CONFIG_MBEDTLS_SSL_PROTO_TLS1_3=y
CONFIG_MBEDTLS_SSL_TLS1_3_KEY_EXCHANGE_MODE_EPHEMERAL_ENABLED=y
CONFIG_MBEDTLS_CIPHERSUITE_TLS1_3_AES_128_GCM_SHA256=y
CONFIG_MBEDTLS_CIPHERSUITE_TLS1_3_AES_256_GCM_SHA384=y
# Curves: P-256 and P-384 for certificates (P-384 for e.g. Let's Encrypt E5/E6
# and AWS ECC CAs), X25519 and P-256 for the key exchange.
CONFIG_PSA_WANT_ECC_SECP_R1_256=y
CONFIG_PSA_WANT_ECC_SECP_R1_384=y
CONFIG_PSA_WANT_ECC_MONTGOMERY_255=y
# TLS 1.3 only allows RSA-PSS signatures, so RSA broker certificates (e.g.
# test.mosquitto.org) and RSA client keys need PSS. Mbed TLS 4.1's TLS 1.2
# client then fails against brokers that speak only TLS 1.2 with an RSA key;
# build those with overlay-tls12-rsa.conf.
CONFIG_MBEDTLS_X509_RSASSA_PSS_SUPPORT=y
CONFIG_PSA_WANT_ALG_RSA_OAEP=y
# SHA-1 is deliberately not enabled: roots self-signed with SHA-1 cannot be
# loaded (see README).

# Certificate validity dates are NOT checked: MBEDTLS_HAVE_TIME_DATE stays off
# because there is no trusted clock at boot. Enabling it also requires setting
# CLOCK_REALTIME (e.g. SNTP + clock_settime()) before the first handshake, or
# every certificate is rejected as not yet valid.

# The board's hardware TRNG (STM32 RNG, NXP ELS TRNG) backs sys_csrand_get()
# and the PSA random generator used by Mbed TLS. Never enable
# TEST_RANDOM_GENERATOR.
CONFIG_ENTROPY_GENERATOR=y

# --- Settings (runtime configuration, see src/config.c) ---------------------
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_ZMS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_RUNTIME=y

# SMP (MCUmgr) on UDP 1337 is enabled by CONFIG_APP_SMP (default y).

# --- Application -------------------------------------------------------------
# mbedTLS runs the handshake (ECDHE + certificate verification) on the thread
# that calls connect(), which is main.
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_EVENTS=y
CONFIG_HWINFO=y
CONFIG_GPIO=y
CONFIG_JSON_LIBRARY=y
