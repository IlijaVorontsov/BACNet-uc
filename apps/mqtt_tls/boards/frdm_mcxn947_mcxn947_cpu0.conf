# FRDM-MCXN947 (cpu0): ENET QoS + LAN PHY (generic MII), ELS TRNG, WWDT.

# Task watchdog backed by the WWDT (alias watchdog0). The WWDT runs from the
# 1 MHz FRO with a fixed /4 prescaler (max ~67 s); give the HW fallback a wide
# margin over the task_wdt kernel timer instead of the default 100 + 20 ms.
CONFIG_WATCHDOG=y
CONFIG_TASK_WDT=y
CONFIG_TASK_WDT_MIN_TIMEOUT=1000
CONFIG_TASK_WDT_HW_FALLBACK_DELAY=1000

# ENET QoS RX ring: with 128-byte net_bufs a 1518-byte frame takes 12
# descriptors, so the default 16 holds a single full-size frame. 48 keep four.
# The driver permanently reserves one RX net_buf per descriptor.
CONFIG_ETH_NXP_ENET_QOS_RX_BUFFER_DESCRIPTORS=48
CONFIG_NET_BUF_RX_COUNT=128
