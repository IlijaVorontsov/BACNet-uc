#
# NUCLEO-F767ZI: on-chip MAC + LAN8742A (RMII), STM32 RNG, IWDG.

# Reboot if the main loop stalls: task watchdog backed by the IWDG (alias
# watchdog0). The IWDG runs from the LSI, which may be up to 25 % fast
# (40 kHz instead of 32 kHz); the default 100 + 20 ms hardware window would
# then expire before the 100 ms feed. The hardware window is 1 s + 7 s: a
# 256 KiB flash sector erase (settings garbage collection, image upload)
# stalls the CPU for up to 4 s (datasheet maximum), during which nothing
# can feed the IWDG.
CONFIG_WATCHDOG=y
CONFIG_TASK_WDT=y
CONFIG_TASK_WDT_MIN_TIMEOUT=1000
CONFIG_TASK_WDT_HW_FALLBACK_DELAY=7000

# The Cortex-M7 caches stay off unless cache management is enabled, and the
# ART accelerator does not cover code fetched over AXIM - so without this the
# TLS handshake runs from uncached flash. Ethernet DMA buffers are in DTCM,
# which the caches never cover, so enabling the D-cache is safe.
CONFIG_CACHE_MANAGEMENT=y
