#
# NUCLEO-H563ZI: on-chip MAC + LAN8742A (RMII), STM32 RNG, IWDG.

# Reboot if the main loop stalls: task watchdog backed by the IWDG (alias
# watchdog0), with a hardware window that tolerates a fast LSI (see
# nucleo_f767zi.conf).
CONFIG_WATCHDOG=y
CONFIG_TASK_WDT=y
CONFIG_TASK_WDT_MIN_TIMEOUT=1000
CONFIG_TASK_WDT_HW_FALLBACK_DELAY=1000
