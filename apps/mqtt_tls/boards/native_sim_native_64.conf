#
# Host test target: native_sim with offloaded sockets (NSOS). The Zephyr socket
# API is mapped onto the host's BSD sockets, so the application reaches a broker
# on the host (or the internet) without TAP interfaces or root privileges. TLS
# still runs in Zephyr's mbedTLS on top of the offloaded TCP socket.
CONFIG_ETH_NATIVE_TAP=n
CONFIG_NET_DRIVERS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_NET_NATIVE_OFFLOADED_SOCKETS=y
CONFIG_HEAP_MEM_POOL_SIZE=4096

# The offloaded interface has no Zephyr-managed address: no DHCP, and don't
# wait for L4 connectivity, which it never reports. (The connection manager
# itself stays, since MCUmgr's UDP transport selects it.)
CONFIG_NET_DHCPV4=n
CONFIG_APP_WAIT_FOR_NETWORK=n
# NSOS sizes struct net_sockaddr for AF_UNIX (110 bytes); the SMP UDP
# transport keeps the peer address in the net_buf user data.
CONFIG_MCUMGR_TRANSPORT_NETBUF_USER_DATA_SIZE=112
