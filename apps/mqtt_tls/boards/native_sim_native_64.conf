# SPDX-License-Identifier: Apache-2.0
#
# Host test target: native_sim with offloaded sockets (NSOS). The Zephyr socket
# API is mapped onto the host's BSD sockets, so the application reaches a broker
# on the host (or the internet) without TAP interfaces or root privileges. TLS
# still runs in Zephyr's mbedTLS on top of the offloaded TCP socket.
CONFIG_ETH_NATIVE_TAP=n
CONFIG_NET_DRIVERS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_NET_NATIVE_OFFLOADED_SOCKETS=y
CONFIG_HEAP_MEM_POOL_SIZE=4096

# The offloaded interface has no Zephyr-managed address to wait for.
CONFIG_NET_CONNECTION_MANAGER=n
CONFIG_NET_DHCPV4=n
