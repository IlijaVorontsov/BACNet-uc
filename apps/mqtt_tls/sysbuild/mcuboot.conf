#
# Appended to the MCUboot image configuration by sysbuild.
#
# Update flow: SMP "image upload" writes slot1, "image test" marks it, "reset"
# swaps it in. The new image runs as a test image; mqtt_tls confirms it once
# it reached "online", otherwise it reboots and MCUboot reverts it.

# Log boot decisions and swap progress on the console UART.
CONFIG_LOG=y
CONFIG_MCUBOOT_LOG_LEVEL_INF=y
