# SPDX-License-Identifier: Apache-2.0
#
# Appended to the mqtt_tls image configuration by sysbuild (image name =
# application directory name). Same content as overlay-mcuboot.conf, which is
# the equivalent for an MCUboot that is flashed separately.
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUBOOT_IMG_MANAGER=y
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_OS_BOOTLOADER_INFO=y
# Erase slot1 sector by sector while the upload proceeds, instead of all at
# once on the first chunk (seconds with the CPU stalled on 256 KiB sectors).
CONFIG_IMG_ERASE_PROGRESSIVELY=y
