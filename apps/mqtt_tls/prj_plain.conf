# SPDX-License-Identifier: Apache-2.0
#
# Plain-TCP variant of prj.conf (no TLS, port 1883), for debugging against a
# local broker only. Build with -DFILE_SUFFIX=plain. Keep the common sections
# of both files in sync.

# --- Logging -----------------------------------------------------------------
CONFIG_LOG=y
CONFIG_NET_LOG=y
CONFIG_LOG_BACKEND_SHOW_COLOR=n

# --- IP stack ----------------------------------------------------------------
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_SOCKETS=y
# DHCPv4 installs only the first DNS server it is offered, so a single
# resolver slot is all that is ever used.
CONFIG_DNS_RESOLVER=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_CONNECTION_MANAGER=y

CONFIG_ZVFS_OPEN_MAX=8
# SO_RCVTIMEO/SO_SNDTIMEO on plain TCP sockets (TLS sockets handle them in the
# TLS layer).
CONFIG_NET_CONTEXT_RCVTIMEO=y
CONFIG_NET_CONTEXT_SNDTIMEO=y

# Bounds the TCP connect.
CONFIG_NET_SOCKETS_CONNECT_TIMEOUT=15000

# RX buffers: the TCP receive window is derived from the pool
# (NET_BUF_RX_COUNT * NET_BUF_DATA_SIZE / 3); the default 1.5 KB window lets
# the broker send only one segment per round trip, and the driver needs 12
# buffers per full-size frame. 96 buffers give a 4 KB window and room for 8
# frames.
CONFIG_NET_BUF_RX_COUNT=96
CONFIG_NET_PKT_RX_COUNT=24

# Ethernet TX runs inline on whichever thread produces the packet (RX thread
# for TCP ACKs, TCP work queue for retransmits, system work queue for DHCP),
# so their default stacks have only a few percent of headroom.
CONFIG_NET_RX_STACK_SIZE=2048
CONFIG_NET_TCP_WORKQ_STACK_SIZE=1536
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=1536
CONFIG_NET_MGMT_EVENT_STACK_SIZE=1024

# --- MQTT --------------------------------------------------------------------
CONFIG_MQTT_LIB=y
CONFIG_MQTT_LIB_TLS=n
CONFIG_MQTT_KEEPALIVE=60

# --- Application -------------------------------------------------------------
# Random back-off jitter comes from the hardware TRNG.
CONFIG_ENTROPY_GENERATOR=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_EVENTS=y
CONFIG_HWINFO=y
CONFIG_GPIO=y
CONFIG_JSON_LIBRARY=y
