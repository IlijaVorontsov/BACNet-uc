# SPDX-License-Identifier: Apache-2.0
#
# For brokers that speak only TLS 1.2 and use an RSA key. With TLS 1.3 enabled
# the client offers RSA-PSS signatures, which such a broker (OpenSSL) picks for
# its TLS 1.2 key exchange, and Mbed TLS 4.1's TLS 1.2 client rejects them
# (alert illegal_parameter). This overlay restricts the device to TLS 1.2 with
# PKCS#1 v1.5 RSA signatures.
#
#   west build ... -- -DEXTRA_CONF_FILE=overlay-tls12-rsa.conf
CONFIG_MBEDTLS_SSL_PROTO_TLS1_3=n
CONFIG_MBEDTLS_SSL_TLS1_3_KEY_EXCHANGE_MODE_EPHEMERAL_ENABLED=n
CONFIG_MBEDTLS_CIPHERSUITE_TLS1_3_AES_128_GCM_SHA256=n
CONFIG_MBEDTLS_CIPHERSUITE_TLS1_3_AES_256_GCM_SHA384=n
CONFIG_MBEDTLS_X509_RSASSA_PSS_SUPPORT=n
