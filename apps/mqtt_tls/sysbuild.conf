#
# MCUboot variant, used only by `west build --sysbuild` (a plain `west build`,
# the release artifact, ignores this file and builds the app without a
# bootloader):
#
#   west build --sysbuild -b nucleo_f767zi apps/mqtt_tls -d build-f767-mcuboot \
#       -- -DFILE_SUFFIX=mcuboot
#   west flash -d build-f767-mcuboot      # MCUboot + signed app
#
# FILE_SUFFIX=mcuboot selects boards/<board>_mcuboot.overlay (settings in a
# partition that MCUboot leaves free). sysbuild/mqtt_tls.conf adds the image
# management, sysbuild/mcuboot.conf the bootloader logging. The swap mode per
# board is chosen in Kconfig.sysbuild (same as the BACnet firmware):
#   nucleo_f767zi              swap using scratch (256 KiB sectors)
#   frdm_mcxn947/mcxn947/cpu0  swap using offset (8 KiB sectors)
#
# The image is signed with the MCUboot development key: NOT for production.
SB_CONFIG_BOOTLOADER_MCUBOOT=y
SB_CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y
