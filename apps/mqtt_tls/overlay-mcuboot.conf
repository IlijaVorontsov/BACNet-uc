#
# App image for an MCUboot that is already on the board (built separately),
# without sysbuild:
#
#   west build -b nucleo_f767zi apps/mqtt_tls -- -DFILE_SUFFIX=mcuboot \
#       -DEXTRA_CONF_FILE=overlay-mcuboot.conf
#
# With `west build --sysbuild` this is done by sysbuild.conf and
# sysbuild/mqtt_tls.conf instead.
#
# Sign the image with the key of the MCUboot on the board, e.g.
#   -DCONFIG_MCUBOOT_SIGNATURE_KEY_FILE=\"/path/to/key.pem\"
# (the MCUboot development key is public: never use it in production). The
# swap mode must match the bootloader (Kconfig: swap using scratch on
# NUCLEO-F767ZI).
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUBOOT_IMG_MANAGER=y
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_OS_BOOTLOADER_INFO=y
# Erase slot1 sector by sector while the upload proceeds, instead of all at
# once on the first chunk (seconds with the CPU stalled on 256 KiB sectors).
CONFIG_IMG_ERASE_PROGRESSIVELY=y
