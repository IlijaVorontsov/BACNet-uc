# SPDX-License-Identifier: Apache-2.0
#
# App image for an MCUboot that is already on the board (built separately),
# without sysbuild:
#
#   west build -b nucleo_f767zi apps/mqtt_tls -- -DFILE_SUFFIX=mcuboot \
#       -DEXTRA_CONF_FILE=overlay-mcuboot.conf
#
# With `west build --sysbuild` this is done by sysbuild.conf and
# sysbuild/mqtt_tls.conf instead.
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUBOOT_IMG_MANAGER=y
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_OS_BOOTLOADER_INFO=y
