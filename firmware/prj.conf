# SPDX-License-Identifier: Apache-2.0
#
# BACnet-uc firmware - common configuration for all boards.
# Board specifics live in boards/<board>.conf and boards/<board>.overlay.

# --- kernel / libc -------------------------------------------------------
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=65536
CONFIG_REQUIRES_FULL_LIBC=y
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_THREAD_NAME=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_THREAD_MONITOR=y
CONFIG_INIT_STACKS=y
CONFIG_REBOOT=y
CONFIG_ASSERT=n

# --- storage -------------------------------------------------------------
# LittleFS at /lfs from the devicetree fstab entry "uc_lfs" (board overlays,
# snippet uc-ramfs). uc_storage formats it when mounting fails
# (CONFIG_UC_STORAGE_FORMAT_ON_FAIL).
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
CONFIG_FILE_SYSTEM_MKFS=y
# open files: log backend, SMP fs group, config, apps, kv store. The file
# cache heap is NUM_FILES x CACHE_SIZE; CACHE_SIZE must equal the largest
# fstab "cache-size" (256 in all overlays and the uc-ramfs snippet).
CONFIG_FS_LITTLEFS_NUM_FILES=8
CONFIG_FS_LITTLEFS_NUM_DIRS=4
CONFIG_FS_LITTLEFS_CACHE_SIZE=256
# configuration documents (uc_config parses numbers itself, no JSON FP support needed)
CONFIG_JSON_LIBRARY=y
# SHA-256 of files (uc_storage_sha256, app install verification)
CONFIG_PSA_CRYPTO=y
CONFIG_PSA_WANT_ALG_SHA_256=y

# --- logging -------------------------------------------------------------
# Runtime level of all sources from device.json "log.level" (default inf).
# BACnet-uc modules are compiled with debug messages so that "dbg" works.
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_LOG_RUNTIME_FILTERING=y
CONFIG_UC_LOG_LEVEL_DBG=y
CONFIG_LOG_BACKEND_FS=y
CONFIG_LOG_BACKEND_FS_DIR="/lfs/log"
CONFIG_LOG_BACKEND_FS_FILES_LIMIT=4
CONFIG_LOG_BACKEND_FS_FILE_SIZE=16384

# --- shell ---------------------------------------------------------------
CONFIG_SHELL=y
CONFIG_SHELL_STACK_SIZE=4096
CONFIG_KERNEL_SHELL=y
CONFIG_FILE_SYSTEM_SHELL=y
CONFIG_NET_SHELL=y

# --- networking ----------------------------------------------------------
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_UDP=y
CONFIG_NET_TCP=n
CONFIG_NET_SOCKETS=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_CONNECTION_MANAGER=y
CONFIG_NET_IF_UNICAST_IPV4_ADDR_COUNT=2
CONFIG_NET_IF_MCAST_IPV4_ADDR_COUNT=2
CONFIG_NET_MAX_CONTEXTS=10
CONFIG_ZVFS_OPEN_MAX=16
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=32
CONFIG_NET_BUF_TX_COUNT=32
CONFIG_NET_TX_STACK_SIZE=2048
CONFIG_NET_RX_STACK_SIZE=2048

# --- management (MCUmgr / SMP) --------------------------------------------
CONFIG_NET_BUF=y
CONFIG_ZCBOR=y
CONFIG_MCUMGR=y
CONFIG_MCUMGR_TRANSPORT_UDP=y
CONFIG_MCUMGR_TRANSPORT_UDP_IPV4=y
CONFIG_MCUMGR_TRANSPORT_UDP_MTU=1024
CONFIG_MCUMGR_TRANSPORT_NETBUF_SIZE=1152
CONFIG_BASE64=y
CONFIG_SHELL_BACKEND_DUMMY=y
CONFIG_MCUMGR_TRANSPORT_SHELL=y
# SMP over the console: every received line (<= 127 bytes) occupies one
# buffer until the shell thread has reassembled it. Clients size requests
# from the 1152-byte SMP buffer (os mcumgr_params) and a 1152-byte request
# is 13 lines sent back to back; with the default of 2 buffers lines are
# dropped ("Failed to alloc SMP buf"). ~2.4 KiB of RAM.
CONFIG_MCUMGR_TRANSPORT_SHELL_RX_BUF_COUNT=16
CONFIG_MCUMGR_GRP_OS=y
CONFIG_MCUMGR_GRP_OS_INFO=y
CONFIG_MCUMGR_GRP_OS_MCUMGR_PARAMS=y
CONFIG_MCUMGR_GRP_FS=y
# modules up to CONFIG_UC_APP_MAX_FILE_SIZE (256 KiB): the download chunk
# framing must hold offsets above 64 KiB
CONFIG_MCUMGR_GRP_FS_MAX_FILE_SIZE_4GB=y
# same limit as UC_PATH_MAX (96 incl. NUL): app key/value files are
# /lfs/data/<app>/<key>, up to 65 characters (default limit 64)
CONFIG_MCUMGR_GRP_FS_PATH_LEN=95
CONFIG_MCUMGR_GRP_FS_CHECKSUM_HASH=y
CONFIG_MCUMGR_GRP_FS_HASH_SHA256=y
CONFIG_MCUMGR_GRP_STAT=y
CONFIG_MCUMGR_GRP_SHELL=y
CONFIG_STATS=y
# SMP handlers run in this work queue: the uc_node reload handler parses
# JSON documents and uc_app install hashes files (default 2048).
CONFIG_MCUMGR_TRANSPORT_WORKQUEUE_STACK_SIZE=4096

# --- BACnet --------------------------------------------------------------
CONFIG_BACNETSTACK=y
CONFIG_BACNET_BASIC_SERVER=y
CONFIG_BACDL_BIP=y
CONFIG_BACDL_BIP_PORT=47808
CONFIG_BACNET_MAX_TSM_TRANSACTIONS=16
CONFIG_BACNET_MAX_ADDRESS_CACHE=32
CONFIG_BACNET_MAX_CHARACTER_STRING_BYTES=64
CONFIG_BACNET_BASIC_COV_SUBSCRIPTIONS_SIZE=16
CONFIG_BACNET_BASIC_OBJECT_NETWORK_PORT=y
CONFIG_BACNET_BASIC_OBJECT_ANALOG_INPUT=y
CONFIG_BACNET_BASIC_OBJECT_ANALOG_OUTPUT=y
CONFIG_BACNET_BASIC_OBJECT_ANALOG_VALUE=y
CONFIG_BACNET_BASIC_OBJECT_BINARY_INPUT=y
CONFIG_BACNET_BASIC_OBJECT_BINARY_OUTPUT=y
CONFIG_BACNET_BASIC_OBJECT_BINARY_VALUE=y
CONFIG_BACNET_BASIC_OBJECT_MULTISTATE_INPUT=y
CONFIG_BACNET_BASIC_OBJECT_MULTISTATE_OUTPUT=y
CONFIG_BACNET_BASIC_OBJECT_MULTISTATE_VALUE=y
# Application value types: minimal set + DOUBLE (+ HOST_N_PORT, used by
# netport.c). Keeps BACNET_APPLICATION_DATA_VALUE at ~112 bytes instead of
# ~1.5 KB with all types (the default when none is selected).
CONFIG_BACAPP_MINIMAL=y
CONFIG_BACAPP_DOUBLE=y
CONFIG_BACAPP_HOST_N_PORT=y
# The stack is only touched by the BACnet thread; the stack's own 'bacnet'
# shell commands would call it from the shell thread.
CONFIG_BACNETSTACK_BACNET_SHELL=n

# --- IO ------------------------------------------------------------------
# Drivers behind the IO channel catalog (boards/io/<board>.dtsi). The
# controller drivers follow the devicetree; on native_sim all channels are
# simulated and only the emulators get built.
CONFIG_GPIO=y
CONFIG_ADC=y
CONFIG_PWM=y

# --- WebAssembly ---------------------------------------------------------
CONFIG_UC_APPS=y
CONFIG_WAMR_FAST_INTERP=y
# The application watchdog (CONFIG_UC_APP_WATCHDOG_MS) stops runaway
# callbacks with wasm_runtime_terminate(), which interrupts a running
# interpreter only with the thread manager's suspend-flag checks.
CONFIG_WAMR_THREAD_MGR=y
