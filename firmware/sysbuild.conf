#
# Sysbuild configuration, used only by `west build --sysbuild` (a plain
# `west build` ignores this file and builds the firmware without a
# bootloader, linked at the start of the flash).
#
#   west build --sysbuild -b nucleo_f767zi BACNet-uc/firmware -d build-f767-mcuboot
#   west flash -d build-f767-mcuboot      # MCUboot + signed firmware
#
# Result: MCUboot in boot_partition, the firmware (signed with the MCUboot
# development key, NOT for production) in slot0_partition, firmware updates
# through the SMP image group (uc harness / mcumgr / smpmgr "image upload",
# "image test", "reset"). sysbuild/firmware.conf adds the application
# settings for the image group, sysbuild/mcuboot.conf the bootloader
# settings. The swap mode per board is selected in Kconfig.sysbuild:
#   nucleo_f767zi              swap using scratch (256 KiB sectors; slot0
#                              and slot1 768 KiB, scratch 256 KiB)
#   frdm_mcxn947/mcxn947/cpu0  swap using offset (8 KiB sectors, 984 KiB
#                              slots)
SB_CONFIG_BOOTLOADER_MCUBOOT=y
SB_CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y
