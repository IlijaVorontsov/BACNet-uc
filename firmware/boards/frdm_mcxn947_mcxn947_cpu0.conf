#
# FRDM-MCXN947 cpu0: Cortex-M33 150 MHz, 2 MiB internal flash, 384 KiB RAM
# used by Zephyr (sram0, see the overlay) + 96 KiB SRAMX, ENET QOS
# Ethernet, /lfs on the 8 MiB FlexSPI NOR flash (see
# frdm_mcxn947_mcxn947_cpu0.overlay).

# Hardware floating point; WAMR is then built for THUMBV8M.MAIN_VFP and AOT
# modules must be compiled with the hard-float ABI.
CONFIG_FPU=y
CONFIG_FP_HARDABI=y

# Ethernet (eth_nxp_enet_qos)
CONFIG_NET_L2_ETHERNET=y

# RAM budget. SRAMX (96 KiB): WAMR pool (chosen uc,app-pool in the
# overlay). SRAM A-G (384 KiB, see the overlay): kernel heap 64 KiB
# (k_malloc: JSON documents, parse scratch, shell/SMP snapshots), malloc
# arena 64 KiB (picolibc malloc: bacnet-stack objects created from io.json
# and by apps, PSA crypto) and ~230 KiB of static data (network buffers,
# thread stacks, BACnet tables, configuration caches); the rest (~33 KiB)
# is margin. The arena has a fixed size so that the linker fails instead of
# silently shrinking it (default -1: whatever RAM is left). Minimum arena:
# 24 KiB (uc-ramfs snippet: 32 KiB, see its boards/ram.conf).
CONFIG_UC_APP_POOL_SIZE=98304
CONFIG_HEAP_MEM_POOL_SIZE=65536
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=65536
