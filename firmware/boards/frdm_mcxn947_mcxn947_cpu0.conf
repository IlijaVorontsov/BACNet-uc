#
# FRDM-MCXN947 core 0: Cortex-M33 150 MHz, 2 MiB internal flash, 320 KiB
# RAM for Zephyr (sram0), ENET QOS Ethernet, 8 MiB W25Q64JV on FlexSPI for
# /lfs (see frdm_mcxn947_mcxn947_cpu0.overlay).

# Hardware floating point; WAMR is then built for THUMBV8M.MAIN_VFP and AOT
# modules must be compiled with the hard-float ABI.
CONFIG_FPU=y
CONFIG_FP_HARDABI=y

# Ethernet (eth_nxp_enet_qos)
CONFIG_NET_L2_ETHERNET=y

# RAM budget (320 KiB): WAMR pool 96 KiB, kernel heap 48 KiB; the rest
# holds network buffers, thread stacks and the BACnet stack tables.
CONFIG_UC_APP_POOL_SIZE=98304
CONFIG_HEAP_MEM_POOL_SIZE=49152
