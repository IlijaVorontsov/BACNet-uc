#
# native_sim/native/64 (64-bit host executable build/zephyr/zephyr.exe).
#
# Networking: Native Simulator Offloaded Sockets (NSOS). Every Zephyr socket
# is a host socket: SMP listens on UDP 1337 and BACnet/IP on the device.json
# UDP port (default 47808) of the host. Run several nodes on one host with
# distinct bacnet.udp_port values and bacnet.static_bindings (127.0.0.1) in
# device.json, and a distinct --flash=<file> per node.
#
# NSOS provides one offloaded interface ("nsos_socket") without IPv4
# configuration and without DHCP. The BACnet/IP port code (bacnet-stack-zephyr
# bip-init.c) needs an IPv4 address and netmask on the interface to derive
# its own address and the broadcast address, so uc_net assigns one:
#   - device.json network.dhcp=false: network.ipv4/netmask (must be an
#     address of the host, otherwise bind() fails),
#   - otherwise: 127.0.0.1/255.0.0.0 (loopback).
# NSOS does not forward SO_BROADCAST to the host socket, so the host rejects
# BACnet broadcasts (Who-Is, I-Am); bind remote devices with static bindings.
#
# The TAP Ethernet driver (would need /dev/net/tun and root) is disabled so
# that the NSOS interface is the only and therefore the default interface.
CONFIG_NET_DRIVERS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_NET_NATIVE_OFFLOADED_SOCKETS=y
CONFIG_ETH_NATIVE_TAP=n
CONFIG_ENTROPY_GENERATOR=y
CONFIG_TEST_RANDOM_GENERATOR=y
# NSOS uses AF_UNIX-sized socket addresses (110 bytes)
CONFIG_MCUMGR_TRANSPORT_NETBUF_USER_DATA_SIZE=112

# Storage: flash simulator backed by flash.bin, see the overlay.

# More room for WebAssembly modules than on the MCUs.
CONFIG_UC_APP_POOL_SIZE=262144
CONFIG_HEAP_MEM_POOL_SIZE=131072
