# SPDX-License-Identifier: Apache-2.0
#
# NUCLEO-F767ZI: Cortex-M7 216 MHz, 2 MiB flash, 384 KiB SRAM (zephyr,sram)
# + 128 KiB DTCM, RMII Ethernet, /lfs on an external SPI NOR flash (see
# nucleo_f767zi.overlay for the wiring).

# Hardware floating point; WAMR is then built for THUMBV7EM_VFP and AOT
# modules must be compiled with the hard-float ABI.
CONFIG_FPU=y
CONFIG_FP_HARDABI=y

# Ethernet (eth_stm32_hal, LAN8742A PHY)
CONFIG_NET_L2_ETHERNET=y

# /lfs: W25Q128JV on SPI1. CONFIG_SPI and CONFIG_SPI_NOR follow the
# devicetree (enabled by the jedec,spi-nor node of the overlay; the uc-ramfs
# snippet disables that node).

# RAM budget (384 KiB SRAM): WAMR pool 128 KiB, kernel heap 64 KiB; the
# rest holds network buffers, thread stacks and the BACnet stack tables.
CONFIG_UC_APP_POOL_SIZE=131072
CONFIG_HEAP_MEM_POOL_SIZE=65536
