#
# NUCLEO-F767ZI: Cortex-M7 216 MHz, 2 MiB flash, 384 KiB SRAM (zephyr,sram)
# + 128 KiB DTCM, RMII Ethernet, /lfs on an external SPI NOR flash (see
# nucleo_f767zi.overlay for the wiring).

# Hardware floating point; WAMR is then built for THUMBV7EM_VFP and AOT
# modules must be compiled with the hard-float ABI.
CONFIG_FPU=y
CONFIG_FP_HARDABI=y

# Ethernet (eth_stm32_hal, LAN8742A PHY)
CONFIG_NET_L2_ETHERNET=y

# /lfs: W25Q128JV on SPI1. CONFIG_SPI and CONFIG_SPI_NOR follow the
# devicetree (enabled by the jedec,spi-nor node of the overlay; the uc-ramfs
# snippet disables that node). The firmware Kconfig sets
# CONFIG_SPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096 (LittleFS blocks of 4 KiB, the
# W25Q sector size, instead of 64 KiB).

# RAM budget. DTCM (128 KiB): Ethernet DMA buffers ~12.3 KiB + WAMR pool
# 112 KiB (chosen uc,app-pool in the overlay). SRAM (384 KiB): kernel heap
# 64 KiB (k_malloc: JSON documents, parse scratch, shell/SMP snapshots),
# malloc arena 64 KiB (picolibc malloc: bacnet-stack objects created from
# io.json and by apps, PSA crypto) and ~230 KiB of static data (network
# buffers, thread stacks, BACnet tables, configuration caches); the rest
# (~33 KiB) is margin. The arena has a fixed size so that the linker fails
# instead of silently shrinking it (default -1: whatever RAM is left).
# Minimum arena: 24 KiB (uc-ramfs snippet: 32 KiB, see its boards/ram.conf).
CONFIG_UC_APP_POOL_SIZE=114688
CONFIG_HEAP_MEM_POOL_SIZE=65536
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=65536
