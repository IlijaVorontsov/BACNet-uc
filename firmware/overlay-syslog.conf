#
# Remote logging: every log message (all modules and the WebAssembly apps'
# uc_log()) is also sent as an RFC 5424 syslog message over UDP.
#
#   west build -b <board> BACNet-uc/firmware -- \
#       -DEXTRA_CONF_FILE=overlay-syslog.conf \
#       '-DCONFIG_LOG_BACKEND_NET_SERVER="192.168.10.10:514"'
#
# Server syntax: "a.b.c.d[:port]" (UDP, default port 514) or
# "tcp://a.b.c.d[:port]". With DHCPv4 the log server option (7) of the
# DHCP server overrides the address. The backend starts when the network
# is connected (connection manager) and uses the device-wide runtime log
# level (device.json "log.level").
CONFIG_LOG_BACKEND_NET=y
CONFIG_LOG_BACKEND_NET_SERVER="192.0.2.1:514"
CONFIG_LOG_BACKEND_NET_AUTOSTART=y
CONFIG_LOG_BACKEND_NET_USE_DHCPV4_OPTION=y

# syslog HOSTNAME: "bacnet-uc-" + last MAC bytes, distinct per node
CONFIG_NET_HOSTNAME_ENABLE=y
CONFIG_NET_HOSTNAME="bacnet-uc"
CONFIG_NET_HOSTNAME_UNIQUE=y
