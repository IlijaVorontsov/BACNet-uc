# SPDX-License-Identifier: Apache-2.0
CONFIG_ZTEST=y
CONFIG_ZTEST_STACK_SIZE=16384
CONFIG_REQUIRES_FULL_LIBC=y
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_HEAP_MEM_POOL_SIZE=131072

# bactext/bacapp for uc_common, no datalink
CONFIG_BACNETSTACK=y

CONFIG_JSON_LIBRARY=y

CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_UC_LOG_LEVEL_WRN=y
# device.json "log.level" is applied as runtime filter (test_log_level_applied)
CONFIG_LOG_RUNTIME_FILTERING=y

# Only uc_common and uc_config are under test. CONFIG_UC_APPS stays at its
# default (y) because uc_config.h sizes the apps tables with
# CONFIG_UC_APPS_MAX / CONFIG_UC_APP_PARAMS_MAX, which only exist then.
CONFIG_UC_MGMT=n
CONFIG_UC_SHELL=n
