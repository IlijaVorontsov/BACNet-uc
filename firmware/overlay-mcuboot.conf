#
# Firmware image for an MCUboot that is already on the board (built
# separately), without sysbuild:
#
#   west build -b nucleo_f767zi BACNet-uc/firmware -- \
#       -DEXTRA_CONF_FILE=overlay-mcuboot.conf
#
# With `west build --sysbuild` this is done by sysbuild.conf and
# sysbuild/firmware.conf instead. The image is linked to slot0_partition
# (zephyr,code-partition) and signed by west (zephyr.signed.bin) when
# CONFIG_MCUBOOT_SIGNATURE_KEY_FILE is set.
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUBOOT_IMG_MANAGER=y
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_OS_BOOTLOADER_INFO=y
