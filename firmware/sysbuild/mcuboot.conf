#
# Appended to the MCUboot image configuration by sysbuild.
#
# Update flow (swap modes): "image upload" writes slot1, "image test" marks
# it, "reset" swaps it into slot0. The new firmware runs as a test image and
# is reverted at the next reset unless an SMP client sends "image confirm".

# Log boot decisions and swap progress on the console UART.
CONFIG_LOG=y
CONFIG_MCUBOOT_LOG_LEVEL_INF=y
