#
# uc-ramfs on the MCU boards: the 64 KiB RAM disk comes out of the SRAM
# budget of boards/<board>.conf in the firmware: kernel heap 64 -> 48 KiB,
# malloc arena 64 -> 32 KiB (still above the 24 KiB minimum). Modules are
# limited to 32 KiB (uc-ramfs.conf), which keeps the heap peaks small.
CONFIG_HEAP_MEM_POOL_SIZE=49152
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=32768
