# SPDX-License-Identifier: Apache-2.0
#
# uc-ramfs: /lfs on a RAM-backed flash simulator (volatile: the content is
# lost at every reset). For boards without external flash, or to run a
# board without its flash module:
#
#   west build -b <board> BACNet-uc/firmware -S uc-ramfs
#
# uc-ramfs.overlay redefines the board's /fstab/lfs node (label uc_lfs), so
# /lfs moves to the RAM disk. Board specifics (boards/):
#   nucleo_f767zi              the SPI NOR flash node is disabled (no driver,
#                              no probe of a missing chip)
#   nucleo_f767zi, frdm_mcxn947  ram.conf: the 64 KiB RAM disk is taken
#                              from the kernel heap and the malloc arena
name: uc-ramfs
append:
  EXTRA_DTC_OVERLAY_FILE: uc-ramfs.overlay
  EXTRA_CONF_FILE: uc-ramfs.conf
boards:
  /nucleo_f767zi(/.*)?/:
    append:
      EXTRA_DTC_OVERLAY_FILE: boards/nucleo_f767zi.overlay
      EXTRA_CONF_FILE: boards/ram.conf
  /frdm_mcxn947(/.*)?/:
    append:
      EXTRA_CONF_FILE: boards/ram.conf
