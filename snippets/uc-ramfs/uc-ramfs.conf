# uc-ramfs snippet: RAM flash simulator for /lfs (see uc-ramfs.overlay).
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_SIMULATOR=y
# the log backend must leave room for configuration and small modules
CONFIG_LOG_BACKEND_FS_FILES_LIMIT=2
CONFIG_LOG_BACKEND_FS_FILE_SIZE=4096
# 64 KiB of RAM go to the file system
CONFIG_UC_APP_MAX_FILE_SIZE=32768
