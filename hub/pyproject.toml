[project]
name = "uc-hub"
version = "0.1.0"
description = "Site gateway and AI harness for BACnet-uc, BACnet/IP and MQTT building devices"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sse-starlette>=2.1",
    "httpx>=0.27",
    "pydantic>=2.8",
    "cbor2>=5.6",
    "jsonschema>=4.23",
    "pyyaml>=6.0",
    "aiosqlite>=0.20",
    "aiomqtt>=2.3",
    "bacpypes3>=0.0.100",
    "mcp>=1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.3",
]

[project.scripts]
uc-hub = "uc_hub.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uc_hub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 60
markers = [
    "mosquitto: needs the mosquitto broker binary on PATH",
    "network: opens local UDP/TCP sockets",
]
