# D24 variant (It2, MQTT-09 keepalive PINGREQ): layered after mqtt-site-hil.conf and adds
# exactly one documented test symbol. With a 120 s publish interval the session idles longer
# than MQTT_KEEPALIVE (60 s), so the client must send PINGREQ. SEC-01 reports variant images
# separately from the release artifacts (mark "variant").
CONFIG_APP_MQTT_PUBLISH_INTERVAL_SEC=120
