# SPDX-License-Identifier: Apache-2.0
#
# D24 site configuration, MQTT mTLS release: layered after mqtt-site-hil.conf
# (-DEXTRA_CONF_FILE="<plain>;<mtls>") and adds exactly the client-auth symbols
# APP_MQTT_TLS_CLIENT_AUTH, _CLIENT_CERT_FILE and _CLIENT_KEY_FILE: the committed TEST-ONLY
# DUT client certificate of hil/pki. Used by TLS-03 (hil.mqtt.release.mtls). @HIL@ is
# rendered by hil/host/build.sh as in mqtt-site-hil.conf.
CONFIG_APP_MQTT_TLS_CLIENT_AUTH=y
CONFIG_APP_MQTT_TLS_CLIENT_CERT_FILE="@HIL@/hil/pki/dut-client.crt"
CONFIG_APP_MQTT_TLS_CLIENT_KEY_FILE="@HIL@/hil/pki/dut-client.key"
