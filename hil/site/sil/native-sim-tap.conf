#
# SIL networking for the native_sim/native/64 images of both apps (FW-13, docs/HIL.md 3.1).
# The apps' own native_sim board confs use NSOS (host sockets). NSOS passes no SO_BROADCAST,
# so BACnet Who-Is/I-Am cannot work on it, and its traffic never appears on the rig's capture
# interface. This fragment switches to Zephyr's own IP stack on the native TAP driver instead:
#   - interface "zeth", which hil/net/up.sh --sil creates in netns lan-a on bridge br-a;
#     run zephyr.exe inside that netns (ip netns exec lan-a <build>/zephyr/zephyr.exe);
#   - a fixed, locally administered MAC (02:48:49:4c = "\x02HIL"), so dnsmasq in netns svc can
#     reserve 192.0.2.10 for it exactly as for the real DUT: the SIL bench file carries this MAC
#     (hil/site/sil/bench-native-sim.yml);
#   - DHCPv4 and the connection manager on, as on the boards (the MQTT native_sim board conf
#     turns both off for NSOS).
# A static address works too: zephyr.exe --ipv4-addr=192.0.2.10 --ipv4-nm=255.255.255.0
# --ipv4-gw=192.0.2.254 (options of the TAP driver). The MQTT image still needs DHCP for its
# DNS server (broker.hil.lan).
CONFIG_NET_SOCKETS_OFFLOAD=n
CONFIG_NET_NATIVE_OFFLOADED_SOCKETS=n
CONFIG_ETH_NATIVE_TAP=y
CONFIG_ETH_NATIVE_TAP_DRV_NAME="zeth"
CONFIG_ETH_NATIVE_TAP_RANDOM_MAC=n
CONFIG_ETH_NATIVE_TAP_MAC_ADDR="02:48:49:4c:00:0a"
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_CONNECTION_MANAGER=y
