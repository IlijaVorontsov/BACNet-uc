# SIL bench for the native_sim/native/64 images built by hil/host/build.sh (mq-sil,
# mq-sil-mtls, bac-sil). The topology then has TAP zeth in netns lan-a (hilrig: board
# native_sim/native/64), and dnsmasq reserves 192.0.2.10 on the fixed TAP MAC of
# hil/site/sil/native-sim-tap.conf. The tests start the image themselves (--sil-dut), and
# with --sil-dut the conftest fills in the same identity from host/bench-sil.yml and the
# image, so this file is only needed to state it explicitly:
#   sudo -E "$(command -v pytest)" --sil --bench hil/site/sil/bench-native-sim.yml \
#       --sil-dut mqtt=<out>/mq-sil/zephyr/zephyr.exe tests/mqtt
name: sil-native
mode: sil
dut:
  profile: sil
  board: native_sim/native/64
  mac: "02:48:49:4c:00:0a"         # CONFIG_ETH_NATIVE_TAP_MAC_ADDR of native-sim-tap.conf
  ip: 192.0.2.10
  bacnet_instance: 260001          # BACnet default instance (FW-02)
  mqtt_client_id: hil-dut          # CONFIG_APP_MQTT_CLIENT_ID of mqtt-sil.conf
