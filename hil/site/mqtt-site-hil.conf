#
# D24 site configuration, MQTT plain release (apps/mqtt_tls): the rig's broker and CA, nothing
# else. Allowlist: APP_MQTT_BROKER_HOSTNAME, APP_MQTT_TLS_CA_CERT_FILE (see README.md).
#
# @HIL@ stands for the HIL checkout. A Kconfig fragment cannot name a path relative to
# itself, and the app resolves relative credential paths against its own directory, so
# hil/host/build.sh renders this file with the absolute checkout path (sed s|@HIL@|$HIL|)
# into <out>/site/ before the build. Used unrendered, the build stops with "credential file
# ... does not exist".
CONFIG_APP_MQTT_BROKER_HOSTNAME="broker.hil.lan"
CONFIG_APP_MQTT_TLS_CA_CERT_FILE="@HIL@/hil/pki/ca.crt"
